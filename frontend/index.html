<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StageManager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
      .root {
        max-width: 720px;
      }
    </style>
  </head>
  <body class="d-flex justify-content-center">
    <div class="root">
      <nav class="navbar border-bottom border-body">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"> StageManager </a>
        </div>
      </nav>
      <main class="mt-1">
        <h2 class="mt-4">Room Token</h2>
        <p class="text-secondary">Insert the token of the room for manage it</p>

        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Insert a token room"
            aria-label="Insert a token room"
            aria-describedby="check-token-btn"
            id="token-input"
          />
          <button
            class="btn btn-outline-primary"
            type="button"
            id="check-token-btn"
          >
            Check
          </button>
        </div>
      </main>
    </div>
    <script src="./js/room.js"></script>
    <script>
      const checkTokenBtn = document.querySelector("#check-token-btn");
      checkTokenBtn.addEventListener("click", checkToken);
      async function checkToken() {
        const token = document.querySelector("#token-input").value;

        if (!token) {
          alert("No token informed");
          return false;
        }

        const room = await getRoomByToken(token);

        if (room.error) {
          alert("Some error on request occur!");
          return false;
        }

        if (!room) {
          alert("Some error on server occur!");
          return false;
        }

        window.location = "r/?t=" + token;
      }
    </script>
  </body>
</html>
