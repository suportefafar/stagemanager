<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer | StageManager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
      * {
        margin: 0;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
        color: #fff;
        height: 100vh;
      }
      #timer-text {
        font-size: 32vw;
      }
      .logo-fafar {
        position: absolute;
        top: 1rem;
        left: 1rem;
      }
      .timer-progress-bar {
        height: 5rem;
        width: 100%;
        background-color: #03fcba;
        position: absolute;
        bottom: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <img class="logo-fafar" src="../image/logo-fafar.png" alt="Logo FAFAR" />
    <h1 id="timer-text">00:00</h1>

    <div class="timer-progress-bar"></div>

    <script src="../js/room.js"></script>
    <script>
      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const TOKEN = urlParams.get("t");

      console.log(TOKEN);

      function uploadProgressBar(timeLeftObj) {
        const timerProgressbar = document.querySelector(".timer-progress-bar");

        if (timeLeftObj.isEnding) {
          timerProgressbar.style.backgroundColor = "#D62828";
        } else if (timeLeftObj.toConclude) {
          timerProgressbar.style.backgroundColor = "#f2b600";
        } else {
          timerProgressbar.style.backgroundColor = "#03fcba";
        }

        timerProgressbar.style.width = timeLeftObj.percentage + "%";
      }

      async function updateUIHandler(token) {
        const room = await getRoomByToken(token);

        if (!room || room.error) {
          console.log("Something went wrong. Trying again....");
        } else {
          const el = document.querySelector("#timer-text");

          const timeLeftObj = updateTimer(room, el);

          console.log(timeLeftObj);

          uploadProgressBar(timeLeftObj);
        }

        setTimeout(() => {
          updateUIHandler(token);
        }, 1000);
      }

      updateUIHandler(TOKEN);
    </script>
  </body>
</html>
